<!doctype html>
<html><head><meta charset="utf-8"><title>Lifenizer History Sync - Settings</title>
<style>
  body{font:14px system-ui,sans-serif;max-width:560px;margin:24px auto;color:#222}
  label{display:block;margin:12px 0 4px}input[type=text],input[type=number],input[type=password]{width:100%;padding:6px;box-sizing:border-box}
  .muted{color:#666;font-size:12px}
  @media (prefers-color-scheme:dark){body{background:#1e1e1e;color:#ddd}input{background:#2a2a2a;color:#ddd}.muted{color:#999}}
</style></head><body>
<h1>Lifenizer History Sync</h1>
<p class="muted">Open Lifenizer, Viewing history panel: it shows the port and token. Data only goes to 127.0.0.1.</p>
<label>Port <input id="port" type="number" min="1" max="65535"></label>
<label>Token <input id="token" type="password" autocomplete="off"></label>
<label><input id="periodic" type="checkbox"> Sync automatically once a day (browser must be running)</label>
<label>Days to look back on first sync <input id="maxDays" type="number" min="1" max="400"></label>
<label>Maximum items per platform and sync <input id="maxItems" type="number" min="50" max="20000"></label>
<label>Wall time limit per platform (seconds) <input id="maxSeconds" type="number" min="15" max="600"></label>
<label><input id="foregroundTabs" type="checkbox"> Open history tabs in the foreground when syncing manually (background tabs usually stop loading older entries; the daily sync always runs in the background)</label>
<label>YouTube history URL <input id="youtubeUrl" type="text"></label>
<label>TikTok watch history URL <input id="tiktokUrl" type="text"></label>
<p><button id="save">Save</button> <button id="test">Test connection</button> <button id="clear">Delete collected data</button> <span id="msg" class="muted"></span></p>
<script src="options.js"></script>
</body></html>
