<!doctype html>
<html><head><meta charset="utf-8"><title>Lifenizer History Sync</title><link rel="icon" type="image/png" href="../icons/icon-32.png">
<style>
  h1{display:flex;align-items:center;gap:10px}h1 img{width:32px;height:32px;flex:none}
  :root{color-scheme:light dark}
  body{font:13px system-ui,sans-serif;width:340px;max-width:calc(100vw - 24px);margin:12px;background:#fff;color:#222;overflow-wrap:anywhere}
  h1{font-size:15px;margin:0 0 8px}
  button{padding:6px 10px;margin:2px 4px 2px 0}
  .card{border:1px solid #ccc;border-radius:6px;padding:8px;margin:8px 0}
  .err{color:#b00020}.ok{color:#1b7f3b}.muted{color:#666}
  a{color:#1767ae}
  @media (prefers-color-scheme:dark){body{background:#1e1e1e;color:#ddd}.card{border-color:#555}.muted{color:#aaa}.err{color:#ff9494}.ok{color:#8ddd9a}a{color:#8ab4f8}}
</style></head><body>
<h1><img src="../icons/icon-48.png" width="32" height="32" alt="">Lifenizer History Sync</h1>
<button id="pair">Connect / Pair with QR</button>
<div id="app" class="muted">Checking app...</div>
<div>
  <label for="platform">History to collect</label>
  <select id="platform"><option value="">Configured accounts</option><option value="youtube">YouTube</option><option value="tiktok">TikTok</option></select>
  <button id="sync">Sync now</button>
  <button id="retry">Retry delivery</button>
  <button id="download">Download export</button>
  <a href="#" id="options">Settings</a>
</div>
<div id="youtube" class="card"></div>
<div id="tiktok" class="card"></div>
<div id="whatsapp" class="card"></div>
<div id="discord" class="card"></div>
<div id="messages" class="muted"></div>
<div id="delivery" class="muted"></div>
<script src="../src/lib/payload.js"></script>
<script src="../src/lib/sync.js"></script>
<script src="popup.js"></script>
</body></html>
